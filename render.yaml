services:
  - type: web
    name: whatsapp-ai-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: zen
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://zunodiphwtydetxhlemo.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SHEET_WEBAPP_URL
        sync: false
      - key: SHEET_SECRET
        sync: false
      - key: TZ_NAME
        value: Africa/Addis_Ababa
